steps:
  - launch: com.kaanf.crew.screenshots
  - tool: open-url
    args:
      url: crew-screenshot://leaderboard
  - tool: await-ui-element
    delayMs: 2500
    args:
      condition: visible
      selector:
        identifier: screenshot-ready-leaderboard
      timeoutMs: 60000
  - tool: await-screen-idle
    args:
      minStableMs: 500
      timeoutMs: 10000
