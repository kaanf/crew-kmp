name: Dev To Main CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  lint-and-unit-tests:
    if: github.event_name != 'pull_request' || github.head_ref == 'dev'
    # commonTest yalnız iOS simulator target'ında koşuyor (KMP modüllerinde host test
    # yok) ve ktor-client-darwin'in metadata klib'i macOS host ister; Linux runner'da
    # iOS target'ları devre dışı kalıp testler sessizce hiç çalışmıyor.
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      # androidApp:assembleDebug google-services.json (gitignore'da) ister; derleme
      # kontrolü için compileDebugKotlin yeterli.
      - name: Run unit tests and compile Android
        run: ./gradlew --no-daemon allTests :androidApp:compileDebugKotlin

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
