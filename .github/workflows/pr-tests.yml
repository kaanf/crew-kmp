name: Dev To Main CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  lint-and-unit-tests:
    if: github.event_name != 'pull_request' || github.head_ref == 'dev'
    # commonTest yalnız iOS simulator target'ında koşuyor (KMP modüllerinde host test
    # yok) ve ktor-client-darwin'in metadata klib'i macOS host ister; Linux runner'da
    # iOS target'ları devre dışı kalıp testler sessizce hiç çalışmıyor.
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      # google-services eklentisi (FCM) derlemeden önce processDebugGoogleServices
      # ile config dosyasını ister, compileDebugKotlin bile ona bağımlı. Gerçek
      # google-services.json gitignore'da olduğu için CI'da şema-geçerli bir
      # placeholder yazıyoruz: burada paketleme yapılmadığından (yalnız test +
      # compile) bu sahte config hiçbir artefakta giremez. CI bir gün gerçek
      # Firebase projesine ihtiyaç duyarsa (ör. App Distribution lane'i) bunun
      # yerine dosyayı secret'tan yazmak gerekir.
      - name: Write placeholder google-services.json
        run: |
          cat > androidApp/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.kaanf.crew"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyCIplaceholderCIplaceholderCIplace00"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Run unit tests and compile Android
        run: ./gradlew --no-daemon allTests :androidApp:compileDebugKotlin

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
